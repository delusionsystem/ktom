name: Deploy fair app

on:
  push:
    branches: [main]
    paths:
      - 'fair-app/**'
      - '.github/workflows/deploy-fair-app.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload fair app
        uses: actions/upload-pages-artifact@v3
        with:
          path: fair-app
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4